name = "trapstand-sync"
main = "src/index.ts"
compatibility_date = "2026-07-12"

[vars]
S3_REGION = "nbg1"
S3_BUCKET = "trapstand-cloud-sync"
S3_ENDPOINT = "https://nbg1.your-objectstorage.com"
PWA_ORIGIN = "*"

# Secrets (set via wrangler secret put):
#   CLUB_WRITE_TOKEN  -> upload encrypted backups and publish live rounds
#   CLUB_READ_TOKEN   -> download encrypted backups and view rankings
#   LIVE_TOKEN        -> public token for /live spectator page
#   S3_ACCESS_KEY_ID  -> Hetzner S3 access key
#   S3_SECRET_ACCESS_KEY -> Hetzner S3 secret key
